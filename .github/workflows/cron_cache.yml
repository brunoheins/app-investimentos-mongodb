name: Sincronizador de Dados Financeiros (D-0)

on:
  schedule:
    # Roda de segunda a sexta (1-5) das 12h às 21h UTC para cotações horárias
    - cron: '0 12-21 * * 1-5'
    
    # Roda no dia 1º de todo mês às 07:00 UTC (04:00 BRT) para o histórico mensal
    - cron: '0 7 1 * *'

  # Habilita a execução manual com opções configuráveis (inputs)
  workflow_dispatch:
    inputs:
      modo:
        description: 'Escolha o modo de sincronização:'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - tudo
          - rv
          - tesouro
          - dividendos
          - historico

jobs:
  maestro-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install pandas requests pymongo yfinance

      - name: Rodar Script Maestro com Parâmetro
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        # Passa o input escolhido na interface para o argumento --modo do script Python
        run: python scripts/sync_cache.py --modo ${{ github.event.inputs.modo || 'auto' }}
