name: Sincronizar Tesouro Direto D-0

on:
  schedule:
    # Roda todos os dias de segunda a sexta, às 08:00 BRT (11:00 UTC)
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # Permite rodar manualmente no GitHub se você quiser testar

jobs:
  atualizar-mongo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install pandas requests pymongo

      - name: Rodar Script de Atualização
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python scripts/sync_tesouro.py
